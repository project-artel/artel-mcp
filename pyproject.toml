[project]
name = "artel-mcp"
version = "0.0.1"
description = "Artel QA as an MCP server: the SDK connects here, Claude Code drives the game through tools."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
]

[project.scripts]
artel-mcp = "artel_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artel_mcp"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
